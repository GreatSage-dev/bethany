name: Verify Bethany

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Run deterministic unit, integration, and word checks
        run: npm run verify

      - name: Run end-to-end HTTP smoke check
        run: npm run smoke
